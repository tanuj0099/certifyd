<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Certifyd Games</title>
<style>
:root {
  --bg:#070b14;
  --panel:#101827;
  --line:rgba(255,255,255,.1);
  --text:#f4f7fb;
  --muted:#8e9aae;
  --orange:#ff7417;
}
* { box-sizing:border-box; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter,system-ui,sans-serif; }
body { overflow-x:hidden; }
.game-header {
  position:sticky; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  gap:20px; padding:14px 24px;
  background:rgba(7,11,20,.96); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand { font:700 21px "Space Grotesk",Inter,sans-serif; white-space:nowrap; }
.brand span { color:var(--orange); }
.game-tabs {
  display:flex; gap:8px; padding:5px;
  background:#101827; border:1px solid var(--line); border-radius:13px;
}
.game-tab {
  border:0; background:transparent; color:var(--muted);
  padding:10px 16px; border-radius:9px; cursor:pointer;
  font:700 13px Inter,sans-serif; transition:.2s;
}
.game-tab:hover { color:white; }
.game-tab.active { color:white; background:linear-gradient(135deg,#ff7417,#ff8e35); box-shadow:0 5px 18px rgba(255,116,23,.2); }
.game-frame {
  width:100%; height:calc(100vh - 73px); min-height:700px;
  border:0; display:block; background:#070b14;
}
@media(max-width:700px) {
  .game-header { padding:10px 12px; flex-direction:column; gap:8px; }
  .game-tabs { width:100%; }
  .game-tab { flex:1; padding:10px 7px; font-size:11px; }
  .game-frame { height:calc(100vh - 105px); min-height:650px; }
}
</style>
</head>
<body>
<header class="game-header">
  <div class="brand">Certifyd <span>Games</span></div>
  <div class="game-tabs" role="tablist" aria-label="Choose a game">
    <button class="game-tab active" data-game="analyst" role="tab" aria-selected="true">🎯 Find the Analyst</button>
    <button class="game-tab" data-game="puzzle" role="tab" aria-selected="false">🧩 Logo Scramble</button>
  </div>
</header>

<iframe id="analystFrame" class="game-frame" title="Find the Analyst"></iframe>
<iframe id="puzzleFrame" class="game-frame" title="Logo Scramble" style="display:none"></iframe>

const analystFrame = document.getElementById("analystFrame");
const puzzleFrame = document.getElementById("puzzleFrame");
const tabs = document.querySelectorAll(".game-tab");

analystFrame.srcdoc = analystHTML;
puzzleFrame.srcdoc = puzzleHTML;

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    const game = tab.dataset.game;
    const analyst = game === "analyst";
    analystFrame.style.display = analyst ? "block" : "none";
    puzzleFrame.style.display = analyst ? "none" : "block";

    tabs.forEach(t => {
      const active = t === tab;
      t.classList.toggle("active", active);
      t.setAttribute("aria-selected", active ? "true" : "false");
    });
  });
});
