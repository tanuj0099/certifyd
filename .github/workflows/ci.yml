name: Certifyd Security & Quality CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Next.js Production Build verification
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ejgadkswcjorkyzkqhfl.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZ2Fka3N3Y2pvcmt5emtxaGZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2MTE5ODksImV4cCI6MjA5MzE4Nzk4OX0.idlg63kuUcwv61zfJYk_3XXouUiWJcC-6JnpmhQdlFI

      - name: High-Severity Dependency Security Audit
        run: npm audit --audit-level=high || true
