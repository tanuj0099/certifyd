const frame = document.getElementById("gameFrame");

function show(html, title){
  frame.title = title;
  frame.srcdoc = html;
}

show(analystHTML, "Find the Analyst");

window.addEventListener("message", event => {
  if(event.source !== frame.contentWindow) return;
  if(!event.data || event.data.type !== "certifyd-game-complete") return;

  if(event.data.game === "analyst"){
    show(puzzleHTML, "Logo Puzzle");
  } else if(event.data.game === "puzzle"){
    show(welcomeHTML, "Welcome to Certifyd");
  }
});
